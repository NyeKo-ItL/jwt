version: "2"

# Explicit, pinned linter set so "no warnings" stays reproducible across
# golangci-lint upgrades. Keep this list in sync with what actually passes.
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - gosec
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    # Local readability rule; CI disables it in the blocking lint job.
    - wsl_v5

formatters:
  enable:
    - gofmt
