version: "2"

# Explicit, pinned linter set so "no warnings" stays reproducible across
# golangci-lint upgrades. Keep this list in sync with what actually passes.
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

formatters:
  enable:
    - gofmt
