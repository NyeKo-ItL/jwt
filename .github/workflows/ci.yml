name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Go 1.27.3 is the minimum supported version. Run on every supported
        # runner because crypto implementations vary by operating system.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.27.3"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          # No third-party deps, so there is no go.sum; key the cache off go.mod.
          cache-dependency-path: go.mod
      - run: go build ./...
      - name: Test with race detector
        if: matrix.os != 'windows-latest'
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out . ./internal/... ./jwttest
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $NF); print $NF}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 85) { printf "coverage %.1f%% is below 85%%\\n", coverage; exit 1 } }'
      - name: Test on Windows
        if: matrix.os == 'windows-latest'
        run: go test ./...
      - name: Coverage gate on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          go test -covermode=count -coverprofile=coverage.out . ./internal/... ./jwttest
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $NF); print $NF}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 85) { printf "coverage %.1f%% is below 85%%\\n", coverage; exit 1 } }'
      - name: Run examples
        shell: bash
        run: |
          set -euo pipefail
          for example in examples/*; do
            go run "./$example"
          done
      # Dependabot pull requests do not receive repository secrets. Upload only
      # from trusted pushes; coverage is still enforced locally on every PR.
      # Release tags run this reusable workflow without repository secrets, so
      # they must not attempt an authenticated Codecov upload.
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          slug: NyeKo-ItL/jwt
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  test-gate:
    # Keep the required-check name stable for branch protection.
    name: test (1.27.2)
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every OS test
        if: needs.test.result != 'success'
        run: exit 1
      - run: echo "All Go 1.27.3 platform tests passed"

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParse, FuzzDecryptClaims, FuzzParseKeySet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          check-latest: true
          cache-dependency-path: go.mod
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30s .

  interop:
    # Cross-checks against golang-jwt/jwt/v5 and go-jose/go-jose/v4. Its own
    # module, so those deps never reach importers of the main package.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          check-latest: true
          cache-dependency-path: interop/go.sum
      - run: cd interop && go test ./...

  standards-watch-tool:
    # Unit tests for the scheduled standards-watch tool (its own module,
    # stdlib only, fixtures only: no network).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: .github/standards/go.mod
      - working-directory: .github/standards
        run: |
          go vet ./...
          go test -race ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --disable=wsl_v5
      - name: Check readable whitespace (advisory)
        continue-on-error: true
        run: golangci-lint run --enable-only=wsl_v5 ./...

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.mod
            .github/tools/go.sum
      - name: Build and run pinned govulncheck
        shell: bash
        run: |
          go -C .github/tools build -o "$RUNNER_TEMP/govulncheck" golang.org/x/vuln/cmd/govulncheck
          "$RUNNER_TEMP/govulncheck" ./...

  apidiff:
    # Fail-closed SemVer gate. On branches it blocks incompatible changes.
    # On release tags it also verifies that the requested tag is at least the
    # minimum bump implied by the public API diff.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.mod
            .github/tools/go.sum
      - name: API compatibility and SemVer
        shell: bash
        run: |
          set -euo pipefail

          current=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            current="$GITHUB_REF_NAME"
            if [[ ! "$current" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag is not stable SemVer: $current"
              exit 1
            fi
          fi

          latest=$(git tag -l --sort=-v:refname \
            | grep -E '^v[1-9][0-9]*\.[0-9]+\.[0-9]+$' \
            | grep -vx "$current" | head -n1 || true)
          if [ -z "$latest" ]; then
            echo "No previous v1.0.0+ release tag — first stable release has no API baseline." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          go -C .github/tools build -o "$RUNNER_TEMP/apidiff" golang.org/x/exp/cmd/apidiff
          apidiff="$RUNNER_TEMP/apidiff"
          module=$(go list -m)
          base="$RUNNER_TEMP/base"
          report="$RUNNER_TEMP/report.txt"
          errors="$RUNNER_TEMP/apidiff-errors.txt"

          git worktree add --detach "$base" "$latest"
          trap 'git worktree remove --force "$base" >/dev/null 2>&1 || true' EXIT
          ( cd "$base" && "$apidiff" -m -w "$RUNNER_TEMP/base.api" "$module" )

          set +e
          "$apidiff" -m "$RUNNER_TEMP/base.api" "$module" >"$report" 2>"$errors"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ ! -s "$report" ]; then
            cat "$errors"
            echo "::error::apidiff failed without producing a compatibility report"
            exit "$status"
          fi

          IFS=. read -r maj min pat <<<"${latest#v}"
          if grep -q '^Incompatible changes:' "$report"; then
            verdict=major; minimum="v$((maj + 1)).0.0"
          elif grep -q '^Compatible changes:' "$report" || [ -s "$report" ]; then
            verdict=minor; minimum="v${maj}.$((min + 1)).0"
          else
            verdict=patch; minimum="v${maj}.${min}.$((pat + 1))"
          fi

          {
            echo "## API diff vs \`$latest\`"
            echo
            echo "Minimum SemVer bump: **$verdict** (\`$minimum\`)."
            if [ -s "$report" ]; then
              echo; echo '```'; cat "$report"; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$current" ]; then
            lowest=$(printf '%s\n%s\n' "$minimum" "$current" | sort -V | head -n1)
            if [ "$lowest" != "$minimum" ]; then
              echo "::error::Tag $current is lower than required minimum $minimum"
              exit 1
            fi
          elif [ "$verdict" = major ]; then
            echo "::error::Incompatible public API change requires at least $minimum"
            exit 1
          fi

  ci-gate:
    name: CI gate
    if: always()
    needs: [test, test-gate, fuzz, interop, standards-watch-tool, lint, vuln, apidiff]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed"
