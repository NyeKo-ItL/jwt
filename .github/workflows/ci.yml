name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Go 1.27 is the minimum supported version. Run on every supported
        # runner because crypto implementations vary by operating system.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.27"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          # No third-party deps, so there is no go.sum; key the cache off go.mod.
          cache-dependency-path: go.mod
      - run: go build ./...
      - name: Test with race detector
        if: matrix.os != 'windows-latest'
        run: |
          go test -race -coverpkg=./... -covermode=atomic -coverprofile=coverage.out . ./internal/... ./jwttest
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $NF); print $NF}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 85) { printf "coverage %.1f%% is below 85%%\\n", coverage; exit 1 } }'
      - name: Test on Windows
        if: matrix.os == 'windows-latest'
        run: go test ./...
      - name: Coverage gate on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          go test -coverpkg=./... -covermode=count -coverprofile=coverage.out . ./internal/... ./jwttest
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $NF); print $NF}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 85) { printf "coverage %.1f%% is below 85%%\\n", coverage; exit 1 } }'
      - name: Run examples
        shell: bash
        run: |
          set -euo pipefail
          for example in examples/*; do
            go run "./$example"
          done
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-gate:
    name: test (1.27)
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every OS test
        if: needs.test.result != 'success'
        run: exit 1
      - run: echo "All Go 1.27 platform tests passed"

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParse, FuzzDecryptClaims, FuzzParseKeySet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: go.mod
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30s .

  interop:
    # Cross-checks against golang-jwt/jwt/v5 and go-jose/go-jose/v4. Its own
    # module, so those deps never reach importers of the main package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: interop/go.sum
      - run: cd interop && go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          args: --disable=wsl_v5
      - name: Check readable whitespace (advisory)
        continue-on-error: true
        run: golangci-lint run --enable-only=wsl_v5 ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  apidiff:
    # Semver gate: dormant until a v1.0.0+ release tag exists; then compares
    # the working tree against the latest release and reports the minimum
    # bump required (patch / minor / major). Fails only on an incompatible
    # (major) change.
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.mod
      - name: API compatibility vs latest release
        shell: bash
        run: |
          set -euo pipefail

          latest=$(git tag -l --sort=-v:refname \
            | grep -E '^v[1-9][0-9]*\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$latest" ]; then
            echo "No v1.0.0+ release tag yet — apidiff gate is dormant." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Baseline release: $latest"

          go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260908205506-85c1c2202aba
          apidiff="$(go env GOPATH)/bin/apidiff"
          module=$(go list -m)
          base="$RUNNER_TEMP/base"
          report="$RUNNER_TEMP/report.txt"

          git worktree add --detach "$base" "$latest"
          if ! ( cd "$base" && "$apidiff" -m -w "$RUNNER_TEMP/base.api" "$module" ); then
            echo "Could not analyze baseline $latest — skipping the gate." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            git worktree remove --force "$base"
            exit 0
          fi
          "$apidiff" -m "$RUNNER_TEMP/base.api" "$module" 2>/dev/null > "$report" || true
          git worktree remove --force "$base"

          IFS=. read -r maj min pat <<<"${latest#v}"
          if grep -q '^Incompatible changes:' "$report"; then
            verdict=major; next="v$((maj + 1)).0.0"
          elif grep -q '^Compatible changes:' "$report" || [ -s "$report" ]; then
            verdict=minor; next="v${maj}.$((min + 1)).0"
          else
            verdict=patch; next="v${maj}.${min}.$((pat + 1))"
          fi

          {
            echo "## API diff vs \`$latest\`"
            echo
            case "$verdict" in
              patch)
                echo "✅ **No exported API change.** A **patch** release (\`$next\`) covers bug fixes only." ;;
              minor)
                echo "➕ **Backwards-compatible additions only.** Needs at least a **minor** release: \`$next\`."
                echo; echo '```'; cat "$report"; echo '```' ;;
              major)
                echo "⛔ **Incompatible API changes.** These require a **major** release: \`$next\`."
                echo; echo '```'; cat "$report"; echo '```' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

          echo "verdict=$verdict  suggested next tag=$next"
          if [ "$verdict" = major ]; then
            echo "::error::Incompatible API change vs ${latest}: the next release must be ${next} (major bump). See the job summary."
            exit 1
          fi
