name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The module requires Go 1.27 (promoted-field struct literals,
        # reflect.Type.Fields). Add newer minors here as they ship.
        go: ["1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          # No third-party deps, so there is no go.sum; key the cache off go.mod.
          cache-dependency-path: go.mod
      - run: go build ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParse, FuzzDecryptClaims, FuzzParseKeySet]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: go.mod
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30s .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
