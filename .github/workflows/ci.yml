name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The module requires Go 1.27 (promoted-field struct literals,
        # reflect.Type.Fields). Add newer minors here as they ship.
        go: ["1.27"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Fuzz smoke
        run: |
          go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 30s .
          go test -run '^$' -fuzz '^FuzzDecryptClaims$' -fuzztime 30s .
          go test -run '^$' -fuzz '^FuzzParseKeySet$' -fuzztime 30s .
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
