name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Full quality gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    name: Security gate
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      id-token: write
      security-events: write


  metadata:
    name: Verify release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Require matching changelog section and clean module
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi
          go mod tidy
          go mod verify
          go -C .github/tools mod tidy
          go -C .github/tools mod verify
          git diff --exit-code -- go.mod .github/tools/go.mod .github/tools/go.sum

  publish:
    name: Publish GitHub release
    needs: [quality, security, metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.2"
          check-latest: true
          cache-dependency-path: |
            go.mod
            .github/tools/go.sum
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean --skip=publish

      # Keyless signing: GitHub's OIDC identity is short-lived and no private
      # signing key is stored as a repository secret.
      - name: Sign release checksums with pinned Sigstore
        run: |
          go -C .github/tools build -o "$RUNNER_TEMP/cosign" github.com/sigstore/cosign/v2/cmd/cosign
          "$RUNNER_TEMP/cosign" sign-blob \
            --yes \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/checksums.txt \
            dist/checksums.txt.sigstore.json \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
