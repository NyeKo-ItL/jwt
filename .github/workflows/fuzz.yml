name: Scheduled fuzzing

on:
  schedule:
    - cron: "41 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParse, FuzzDecryptClaims, FuzzParseKeySet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: go.mod
      - name: Fuzz for five minutes
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 5m .
