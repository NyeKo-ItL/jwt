version: 2
updates:
  # The importable module has zero third-party runtime dependencies, so only
  # the GitHub Actions and the isolated interop test module need updates.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: "/interop"
    schedule:
      interval: weekly
    commit-message:
      prefix: interop
