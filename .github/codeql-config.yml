name: jwt

disabled-default-queries: false

# Analyze the importable library only. CI tooling and interoperability fixtures
# have their own dependency and test gates; keeping them out avoids CodeQL
# treating isolated tool modules as production code.
paths:
  - '**/*.go'
paths-ignore:
  - '.github/tools/**'
  - '.github/standards/**'
  - 'interop/**'
  - 'examples/**'
